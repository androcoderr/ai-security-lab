version: '3.8'

services:
  db:
    image: postgres:13
    container_name: hacker-lab-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lab-net

  redis:
    image: redis/redis-stack:latest
    container_name: hacker-lab-redis
    ports:
      - "6379:6379"
    networks:
      - lab-net

  ollama:
    image: ollama/ollama:latest
    container_name: hacker-lab-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - lab-net


  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: hacker-lab-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - lab-net


  kibana:
    image: kibana:8.12.0
    container_name: hacker-lab-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - lab-net

  backend:
    build: .
    env_file:
      - .env
    container_name: hacker-lab-backend
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=mysecretpassword
      - DB_NAME=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
      - ollama
    networks:
      - lab-net

volumes:
  postgres_data:
  ollama_data:

networks:
  lab-net:
    driver: bridge
